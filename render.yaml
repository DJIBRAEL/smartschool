databases:
  - name: smartschool-db
    databaseName: smartschool
    user: smartschool_user
    plan: free

services:
  - type: web
    name: smartschool-api
    runtime: node
    rootDir: api
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node prisma/seed.js; npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartschool-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  - type: web
    name: smartschool-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
