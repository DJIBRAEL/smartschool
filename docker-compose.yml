services:
  postgres:
    image: postgres:16-alpine
    container_name: smartschool-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartschool
    ports:
      - "5432:5432"
    volumes:
      - smartschool_pgdata:/var/lib/postgresql/data

volumes:
  smartschool_pgdata:
